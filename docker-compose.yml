services:
  app:
    build: .
    container_name: finance_app
    ports:
      - "5000:5000"  
    depends_on:
      - azurite
    volumes:
      - .:/app
      - ./test_data:/app/test_data
      - ./financial_data:/app/financial_data
      - ./competitor_analysis:/app/competitor_analysis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite_storage
    ports:
      - "10000:10000" 
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    volumes:
      - azurite_data:/data

volumes:
  azurite_data:
